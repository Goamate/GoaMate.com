<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer rim gradient -->
    <linearGradient id="outerRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Sunset gradient -->
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Text paths for curved text -->
    <!-- Top arc for GOA MATE -->
    <path id="topTextArc" d="M 95 245 A 165 165 0 0 1 405 245" fill="none"/>
    <!-- Bottom arc for CAR & BIKE RENTAL -->
    <path id="bottomTextArc" d="M 90 260 A 175 175 0 0 0 410 260" fill="none"/>
  </defs>

  <!-- Outer Ring with rim border -->
  <circle cx="250" cy="250" r="242" fill="url(#outerRim)" stroke="#1E293B" stroke-width="6"/>
  <circle cx="250" cy="250" r="226" fill="#0F172A" />
  <circle cx="250" cy="250" r="220" fill="#FFFDF7" stroke="#1E293B" stroke-width="4"/>

  <!-- Top Green Arch Banner -->
  <path d="M 68 250 A 190 190 0 0 1 432 250 L 372 250 A 130 130 0 0 0 128 250 Z" fill="#047857" stroke="#064E3B" stroke-width="3"/>

  <!-- Center Circle (Vehicle & Sunset Scene) -->
  <g>
    <!-- Center circular clipping mask -->
    <clipPath id="centerCircleClip">
      <circle cx="250" cy="265" r="126" />
    </clipPath>

    <!-- Base Circle Background: Left Green, Right Sunset -->
    <g clip-path="url(#centerCircleClip)">
      <!-- Left half green -->
      <rect x="120" y="130" width="130" height="270" fill="#059669" />
      
      <!-- Right half sunset sky -->
      <rect x="250" y="130" width="135" height="270" fill="url(#sunsetSky)" />

      <!-- Golden Sun disc in right half -->
      <circle cx="305" cy="225" r="50" fill="#FEF08A" />

      <!-- Palm trees silhouettes on sun -->
      <path d="M 292 215 Q 290 185 282 172 Q 284 172 288 175 Q 293 190 295 215 Z" fill="#064E3B" />
      <!-- Palm fronds left tree -->
      <path d="M 282 172 Q 268 165 260 174 Q 272 173 282 172 Z" fill="#064E3B" />
      <path d="M 282 172 Q 276 158 280 152 Q 284 163 282 172 Z" fill="#064E3B" />
      <path d="M 282 172 Q 292 160 300 162 Q 293 168 282 172 Z" fill="#064E3B" />
      <path d="M 282 172 Q 295 174 304 180 Q 293 178 282 172 Z" fill="#064E3B" />

      <!-- Second palm tree trunk -->
      <path d="M 308 215 Q 312 188 318 178 Q 315 188 311 215 Z" fill="#064E3B" />
      <!-- Palm fronds right tree -->
      <path d="M 318 178 Q 306 170 300 176 Q 311 176 318 178 Z" fill="#064E3B" />
      <path d="M 318 178 Q 320 166 326 164 Q 323 173 318 178 Z" fill="#064E3B" />
      <path d="M 318 178 Q 330 172 338 178 Q 328 181 318 178 Z" fill="#064E3B" />

      <!-- Hill/Ground silhouette in sunset -->
      <path d="M 250 215 Q 310 210 380 238 L 380 395 L 250 395 Z" fill="#0F172A" />

      <!-- Car Graphic on the right -->
      <g transform="translate(250, 215)">
        <!-- Car roof and pillars -->
        <path d="M 20 28 L 78 26 Q 84 26 86 32 L 92 48 L 10 48 Z" fill="#0F172A" />
        <!-- Windshield -->
        <path d="M 24 30 L 75 29 L 83 45 L 18 45 Z" fill="#0284C7" opacity="0.6" />
        <!-- Car Body Red/Orange -->
        <path d="M 0 45 Q 45 42 90 47 Q 95 50 94 65 L 90 100 L 5 100 L 0 85 Z" fill="#EA580C" />
        <!-- Car Front Grille & Headlight details -->
        <path d="M 52 56 L 86 52 L 84 62 L 50 64 Z" fill="#0F172A" />
        <path d="M 4 66 Q 48 64 88 68 L 86 78 Q 45 74 4 80 Z" fill="#0F172A" />
        <path d="M 4 86 Q 45 82 86 88 L 84 96 Q 45 92 4 96 Z" fill="#0F172A" />
        <!-- Front bumper edge -->
        <rect x="6" y="98" width="80" height="25" fill="#090D16" rx="3" />
      </g>

      <!-- Scooter Graphic on the left -->
      <g transform="translate(150, 200)">
        <!-- Handlebars & Mirrors -->
        <!-- Left Mirror -->
        <circle cx="12" cy="18" r="7" fill="#0F172A" />
        <path d="M 12 25 L 24 38" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        <!-- Right Mirror -->
        <circle cx="78" cy="18" r="7" fill="#0F172A" />
        <path d="M 78 25 L 66 38" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
        <!-- Handlebar bar -->
        <path d="M 18 36 Q 45 30 72 36" stroke="#0F172A" stroke-width="6" stroke-linecap="round"/>

        <!-- Headlight circular orange -->
        <circle cx="45" cy="38" r="13" fill="#EA580C" stroke="#0F172A" stroke-width="3" />
        <circle cx="45" cy="38" r="8" fill="#FDBA74" />

        <!-- Scooter Front Apron / Body -->
        <path d="M 28 50 Q 45 47 62 50 Q 68 75 66 98 Q 45 102 24 98 Q 22 75 28 50 Z" fill="#0F172A" />
        <!-- Apron Green Shield Accent -->
        <path d="M 34 58 Q 45 56 56 58 Q 59 78 57 92 Q 45 96 33 92 Q 31 78 34 58 Z" fill="#047857" stroke="#10B981" stroke-width="2"/>

        <!-- Front Fender & Wheel -->
        <path d="M 38 98 L 52 98 L 50 140 L 40 140 Z" fill="#047857" />
        <rect x="39" y="105" width="12" height="35" rx="4" fill="#0F172A" />
      </g>
      
      <!-- Ground Horizon base line -->
      <rect x="120" y="325" width="260" height="75" fill="#0F172A" />
    </g>

    <!-- Center Circle Outer Border -->
    <circle cx="250" cy="265" r="126" fill="none" stroke="#0F172A" stroke-width="7"/>
  </g>

  <!-- Left & Right Black Curved Accent Brackets -->
  <path d="M 94 250 A 170 170 0 0 1 106 315" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 406 250 A 170 170 0 0 0 394 315" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>

  <!-- Top Text: GOA MATE -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="8">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      GOA MATE
    </textPath>
  </text>

  <!-- Bottom Text: CAR & BIKE RENTAL -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="29" fill="#0F172A" letter-spacing="5">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      CAR &amp; BIKE RENTAL
    </textPath>
  </text>

  <!-- Bottom rim red accent arc -->
  <path d="M 125 435 A 220 220 0 0 0 375 435 L 360 455 A 235 235 0 0 1 140 455 Z" fill="#DC2626" />
</svg>
