<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoaMate – Car & Bike Rental in Goa | Self-Drive Cars & Scooters</title>
    <meta name="description" content="Rent verified self-drive cars, bikes, and scooters in Margao and throughout Goa. Zero hidden charges, transparent pricing, easy document upload, and fast WhatsApp booking assistance." />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="GoaMate – Car & Bike Rental in Goa" />
    <meta property="og:description" content="Explore Goa your way with verified cars, scooters, and bikes. Margao, Madgaon Station, Airport, and South Goa delivery available." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="GoaMate" />
    <meta property="og:image" content="/goamate-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GoaMate – Car & Bike Rental in Goa" />
    <meta name="twitter:description" content="Explore Goa your way with verified cars, scooters, and bikes." />

    <!-- Canonical URL placeholder handled by client router/meta -->
    <link rel="canonical" href="https://goamate.com" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD LocalBusiness Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AutoRental",
      "name": "GoaMate – Car & Bike Rental Service",
      "image": "https://goamate.com/goamate-logo.png",
      "telephone": "+919403784132",
      "email": "goamate.com@gmail.com",
      "url": "https://goamate.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Margao",
        "addressRegion": "Goa",
        "addressCountry": "IN"
      },
      "areaServed": [
        "Margao", "Madgaon Railway Station", "Dabolim Airport", "Mopa GOX Airport",
        "Colva", "Benaulim", "Vasco da Gama", "Panaji", "Candolim", "Calangute"
      ],
      "priceRange": "₹₹",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Cash, UPI, Bank Transfer on delivery"
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center;">
          <div style="width: 42px; height: 42px; border: 3px solid #cbd5e1; border-top-color: #059669; border-radius: 50%; animation: gm-spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
          <div style="font-size: 15px; font-weight: 600; color: #1e293b;">Loading GoaMate...</div>
        </div>
      </div>
    </div>
    <style>
      @keyframes gm-spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.firstElementChild || root.firstElementChild.id !== 'app-container')) {
          console.error('Global script error:', e);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
